<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">KENT MOBILE logo</title>
  <desc id="desc">Round gold framed logo for KENT MOBILE with crown and city sunset background.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a120a"/>
      <stop offset="45%" stop-color="#070709"/>
      <stop offset="100%" stop-color="#020203"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffef9c"/>
      <stop offset="18%" stop-color="#ffc94d"/>
      <stop offset="42%" stop-color="#ffb52e"/>
      <stop offset="62%" stop-color="#e88c0b"/>
      <stop offset="100%" stop-color="#ffd972"/>
    </linearGradient>
    <linearGradient id="textGold" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#fff9ef"/>
      <stop offset="25%" stop-color="#f4efe7"/>
      <stop offset="50%" stop-color="#ffca69"/>
      <stop offset="75%" stop-color="#f5ae3d"/>
      <stop offset="100%" stop-color="#fff2d0"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#1d1b2b"/>
      <stop offset="30%" stop-color="#2f1d1b"/>
      <stop offset="60%" stop-color="#4c220f"/>
      <stop offset="100%" stop-color="#f2a14c"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bgGlow)"/>

  <circle cx="320" cy="320" r="292" fill="none" stroke="url(#gold)" stroke-width="8" filter="url(#softGlow)"/>
  <circle cx="320" cy="320" r="272" fill="none" stroke="rgba(255,181,46,0.35)" stroke-width="2"/>

  <g opacity="0.9">
    <path d="M108 308 L110 294 L176 294 L180 308 L108 308 Z" fill="url(#gold)" opacity="0.5"/>
    <path d="M112 314 L180 314 L175 330 L116 330 Z" fill="url(#gold)" opacity="0.35"/>
  </g>

  <g>
    <path d="M120 120 L170 120 L196 165 L214 165 L214 186 L190 186 L167 208 L152 208 L142 193 L130 208 L113 208 L142 186 L111 186 L111 165 L131 165 Z" fill="url(#gold)"/>
